[package]
name = "p2pshare-audio"
version = "1.0.0"
edition = "2021"
description = "Captura o audio do sistema excluindo um processo, para o P2PShare"
license = "GPL-3.0-or-later"

# O macro #[implement] gera caminhos absolutos para windows_core, entao o
# crate precisa estar declarado, nao so' reexportado por windows::core.
[dependencies]
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
